<rect x="67.6" y="70.0" width="178.0" height="44.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="76.6" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.Composition</text>
<text x="76.6" y="103.0" font-size="12" fill="#444">Parallelogram composition</text>
<rect x="29.2" y="130.0" width="254.8" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="38.2" y="148.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.EuclidI40</text>
<text x="38.2" y="163.0" font-size="12" fill="#444">Euclid I.40, equal triangles on equal</text>
<text x="38.2" y="178.0" font-size="12" fill="#444">bases and in the same parallels</text>
<rect x="26.0" y="205.0" width="261.2" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="35.0" y="223.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L1</text>
<text x="35.0" y="238.0" font-size="12" fill="#444">Ultimate equality from approach closer</text>
<text x="35.0" y="253.0" font-size="12" fill="#444">than any given difference</text>
<rect x="361.2" y="220.0" width="274.0" height="44.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="370.2" y="238.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L10</text>
<text x="370.2" y="253.0" font-size="12" fill="#444">Initial displacement under regular force</text>
<rect x="361.2" y="145.0" width="274.0" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="370.2" y="163.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L11</text>
<text x="370.2" y="178.0" font-size="12" fill="#444">Contact subtense ultimately quadratic in</text>
<text x="370.2" y="193.0" font-size="12" fill="#444">arc chord</text>
<rect x="709.2" y="145.0" width="274.0" height="74.0" rx="5" fill="#cfe3f7" stroke="#2c6e31" stroke-width="2.2"/>
<text x="718.2" y="163.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L11Cubic</text>
<text x="718.2" y="178.0" font-size="12" fill="#444">Cubic curvilinear areas and segments via</text>
<text x="718.2" y="193.0" font-size="12" fill="#444">the parabola</text>
<text x="718.2" y="208.0" font-size="12" fill="#2c6e31">2 Lean result(s)</text>
<rect x="29.2" y="280.0" width="254.8" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="38.2" y="298.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L11Restriction</text>
<text x="38.2" y="313.0" font-size="12" fill="#444">Finite nonzero curvature restriction;</text>
<text x="38.2" y="328.0" font-size="12" fill="#444">higher/lower orders excluded</text>
<rect x="364.4" y="70.0" width="267.6" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="373.4" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L2</text>
<text x="373.4" y="103.0" font-size="12" fill="#444">Equal-width inscribed and circumscribed</text>
<text x="373.4" y="118.0" font-size="12" fill="#444">figures approach the given curve</text>
<rect x="750.8" y="70.0" width="190.8" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="759.8" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L3</text>
<text x="759.8" y="103.0" font-size="12" fill="#444">Unequal-width enclosure and</text>
<text x="759.8" y="118.0" font-size="12" fill="#444">maximum-width refinement</text>
<rect x="1057.2" y="70.0" width="274.0" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="1066.2" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L3C1</text>
<text x="1066.2" y="103.0" font-size="12" fill="#444">Ultimate rectangle figures coincide with</text>
<text x="1066.2" y="118.0" font-size="12" fill="#444">the given curvilinear figure</text>
<rect x="1405.2" y="70.0" width="261.2" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="1414.2" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L3C2</text>
<text x="1414.2" y="103.0" font-size="12" fill="#444">Chord figure coincides ultimately with</text>
<text x="1414.2" y="118.0" font-size="12" fill="#444">the given curvilinear figure</text>
<rect x="1057.2" y="145.0" width="274.0" height="74.0" rx="5" fill="#cfe3f7" stroke="#2c6e31" stroke-width="2.2"/>
<text x="1066.2" y="163.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L3C3</text>
<text x="1066.2" y="178.0" font-size="12" fill="#444">Tangent figure coincides ultimately with</text>
<text x="1066.2" y="193.0" font-size="12" fill="#444">the given curvilinear figure</text>
<text x="1066.2" y="208.0" font-size="12" fill="#2c6e31">3 Lean result(s)</text>
<rect x="1740.4" y="70.0" width="267.6" height="59.0" rx="5" fill="#cfe3f7" stroke="#2c6e31" stroke-width="2.2"/>
<text x="1749.4" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L3C4</text>
<text x="1749.4" y="103.0" font-size="12" fill="#444">Curvilinear limit of polygon perimeters</text>
<text x="1749.4" y="118.0" font-size="12" fill="#2c6e31">2 Lean result(s)</text>
<rect x="26.0" y="355.0" width="261.2" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="35.0" y="373.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L5</text>
<text x="35.0" y="388.0" font-size="12" fill="#444">Corresponding sides and duplicate area</text>
<text x="35.0" y="403.0" font-size="12" fill="#444">ratios for similar figures</text>
<rect x="83.6" y="430.0" width="146.0" height="44.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="92.6" y="448.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.L9</text>
<text x="92.6" y="463.0" font-size="12" fill="#444">Limiting area ratios</text>
<rect x="86.8" y="490.0" width="139.6" height="44.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="95.8" y="508.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.Law1</text>
<text x="95.8" y="523.0" font-size="12" fill="#444">Rectilinear inertia</text>
<rect x="32.4" y="550.0" width="248.4" height="44.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="41.4" y="568.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.Law2</text>
<text x="41.4" y="583.0" font-size="12" fill="#444">Impressed force and generated motion</text>
<rect x="35.6" y="610.0" width="242.0" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="44.6" y="628.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.LawCor5</text>
<text x="44.6" y="643.0" font-size="12" fill="#444">Uniform translation leaves relative</text>
<text x="44.6" y="658.0" font-size="12" fill="#444">motions unchanged</text>
<rect x="380.4" y="355.0" width="235.6" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="389.4" y="373.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.LawCor6</text>
<text x="389.4" y="388.0" font-size="12" fill="#444">Equal parallel accelerations leave</text>
<text x="389.4" y="403.0" font-size="12" fill="#444">relative motions unchanged</text>
<rect x="2082.0" y="70.0" width="261.2" height="74.0" rx="5" fill="#cfe3f7" stroke="#2c6e31" stroke-width="2.2"/>
<text x="2091.0" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.P1</text>
<text x="2091.0" y="103.0" font-size="12" fill="#444">Equal-time areas from central impulses</text>
<text x="2091.0" y="118.0" font-size="12" fill="#444">and polygon limit</text>
<text x="2091.0" y="133.0" font-size="12" fill="#2c6e31">5 Lean result(s)</text>
<rect x="364.4" y="280.0" width="267.6" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="373.4" y="298.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.P2</text>
<text x="373.4" y="313.0" font-size="12" fill="#444">Area-time proportionality about a fixed</text>
<text x="373.4" y="328.0" font-size="12" fill="#444">or uniformly translating point implies</text>
<rect x="718.8" y="310.0" width="254.8" height="74.0" rx="5" fill="#cfe3f7" stroke="#2c6e31" stroke-width="2.2"/>
<text x="727.8" y="328.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.P3</text>
<text x="727.8" y="343.0" font-size="12" fill="#444">Relative area law about a moving body</text>
<text x="727.8" y="358.0" font-size="12" fill="#444">identifies the difference of</text>
<text x="727.8" y="373.0" font-size="12" fill="#2c6e31">4 Lean result(s)</text>
<rect x="722.0" y="235.0" width="248.4" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="731.0" y="253.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.P4</text>
<text x="731.0" y="268.0" font-size="12" fill="#444">Uniform circular-force comparison by</text>
<text x="731.0" y="283.0" font-size="12" fill="#444">squared simultaneous arcs divided by</text>
<rect x="2417.2" y="70.0" width="274.0" height="59.0" rx="5" fill="#cfe3f7" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="2426.2" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1687.P6</text>
<text x="2426.2" y="103.0" font-size="12" fill="#444">Force through tangent departure and time</text>
<text x="2426.2" y="118.0" font-size="12" fill="#444">squared</text>
<text x="26" y="753" font-size="12" font-weight="bold">Stages</text>
