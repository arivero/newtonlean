<rect x="422.0" y="430.0" width="178.0" height="59.0" rx="5" fill="#d6ecd2" stroke="#2c6e31" stroke-width="2.2"/>
<text x="431.0" y="448.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.Composition</text>
<text x="431.0" y="463.0" font-size="12" fill="#444">Parallelogram composition</text>
<text x="431.0" y="478.0" font-size="12" fill="#2c6e31">3 Lean result(s)</text>
<rect x="35.6" y="70.0" width="254.8" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="44.6" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.EuclidI40</text>
<text x="44.6" y="103.0" font-size="12" fill="#444">Euclid I.40, equal triangles on equal</text>
<text x="44.6" y="118.0" font-size="12" fill="#444">bases and in the same parallels</text>
<rect x="32.4" y="145.0" width="261.2" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="41.4" y="163.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L1</text>
<text x="41.4" y="178.0" font-size="12" fill="#444">Ultimate equality from approach closer</text>
<text x="41.4" y="193.0" font-size="12" fill="#444">than any given difference</text>
<rect x="377.2" y="370.0" width="267.6" height="44.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="386.2" y="388.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L10</text>
<text x="386.2" y="403.0" font-size="12" fill="#444">Initial displacement under finite force</text>
<rect x="26.0" y="220.0" width="274.0" height="44.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="35.0" y="238.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L10C3</text>
<text x="35.0" y="253.0" font-size="12" fill="#444">Spaces jointly as force and time squared</text>
<rect x="380.4" y="145.0" width="261.2" height="59.0" rx="5" fill="#d6ecd2" stroke="#2c6e31" stroke-width="2.2"/>
<text x="389.4" y="163.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L10C4</text>
<text x="389.4" y="178.0" font-size="12" fill="#444">Force as space divided by time squared</text>
<text x="389.4" y="193.0" font-size="12" fill="#2c6e31">1 Lean result(s)</text>
<rect x="374.0" y="220.0" width="274.0" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="383.0" y="238.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L11</text>
<text x="383.0" y="253.0" font-size="12" fill="#444">Contact subtense ultimately quadratic in</text>
<text x="383.0" y="268.0" font-size="12" fill="#444">arc chord</text>
<rect x="96.4" y="280.0" width="133.2" height="44.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="105.4" y="298.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L11C2</text>
<text x="105.4" y="313.0" font-size="12" fill="#444">Quadratic sagittae</text>
<rect x="45.2" y="340.0" width="235.6" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="54.2" y="358.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L11C3</text>
<text x="54.2" y="373.0" font-size="12" fill="#444">Sagitta quadratic in time at given</text>
<text x="54.2" y="388.0" font-size="12" fill="#444">velocity</text>
<rect x="722.0" y="220.0" width="274.0" height="74.0" rx="5" fill="#d6ecd2" stroke="#2c6e31" stroke-width="2.2"/>
<text x="731.0" y="238.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L11Cubic</text>
<text x="731.0" y="253.0" font-size="12" fill="#444">Cubic curvilinear areas and segments via</text>
<text x="731.0" y="268.0" font-size="12" fill="#444">the parabola</text>
<text x="731.0" y="283.0" font-size="12" fill="#2c6e31">2 Lean result(s)</text>
<rect x="35.6" y="415.0" width="254.8" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="44.6" y="433.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L11Restriction</text>
<text x="44.6" y="448.0" font-size="12" fill="#444">Finite nonzero curvature restriction;</text>
<text x="44.6" y="463.0" font-size="12" fill="#444">higher/lower orders excluded</text>
<rect x="377.2" y="70.0" width="267.6" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="386.2" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L2</text>
<text x="386.2" y="103.0" font-size="12" fill="#444">Equal-width inscribed and circumscribed</text>
<text x="386.2" y="118.0" font-size="12" fill="#444">figures approach the given curve</text>
<rect x="763.6" y="70.0" width="190.8" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="772.6" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L3</text>
<text x="772.6" y="103.0" font-size="12" fill="#444">Unequal-width enclosure and</text>
<text x="772.6" y="118.0" font-size="12" fill="#444">maximum-width refinement</text>
<rect x="1070.0" y="70.0" width="267.6" height="44.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="1079.0" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L3C4</text>
<text x="1079.0" y="103.0" font-size="12" fill="#444">Curvilinear limit of polygon perimeters</text>
<rect x="35.6" y="490.0" width="254.8" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="44.6" y="508.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L7</text>
<text x="44.6" y="523.0" font-size="12" fill="#444">Vanishing arc, chord and tangent have</text>
<text x="44.6" y="538.0" font-size="12" fill="#444">the ultimate ratio of equality</text>
<rect x="90.0" y="565.0" width="146.0" height="44.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="99.0" y="583.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.L9</text>
<text x="99.0" y="598.0" font-size="12" fill="#444">Limiting area ratios</text>
<rect x="93.2" y="625.0" width="139.6" height="44.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="102.2" y="643.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.Law1</text>
<text x="102.2" y="658.0" font-size="12" fill="#444">Rectilinear inertia</text>
<rect x="38.8" y="685.0" width="248.4" height="44.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="47.8" y="703.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.Law2</text>
<text x="47.8" y="718.0" font-size="12" fill="#444">Impressed force and generated motion</text>
<rect x="42.0" y="745.0" width="242.0" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="51.0" y="763.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.LawCor5</text>
<text x="51.0" y="778.0" font-size="12" fill="#444">Uniform translation leaves relative</text>
<text x="51.0" y="793.0" font-size="12" fill="#444">motions unchanged</text>
<rect x="393.2" y="505.0" width="235.6" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="402.2" y="523.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.LawCor6</text>
<text x="402.2" y="538.0" font-size="12" fill="#444">Equal parallel accelerations leave</text>
<text x="402.2" y="553.0" font-size="12" fill="#444">relative motions unchanged</text>
<rect x="1411.6" y="70.0" width="261.2" height="74.0" rx="5" fill="#d6ecd2" stroke="#2c6e31" stroke-width="2.2"/>
<text x="1420.6" y="88.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.P1</text>
<text x="1420.6" y="103.0" font-size="12" fill="#444">Equal-time areas from central impulses</text>
<text x="1420.6" y="118.0" font-size="12" fill="#444">and polygon limit</text>
<text x="1420.6" y="133.0" font-size="12" fill="#2c6e31">4 Lean result(s)</text>
<rect x="38.8" y="820.0" width="248.4" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="47.8" y="838.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.P1C2</text>
<text x="47.8" y="853.0" font-size="12" fill="#444">The limiting diagonal from two</text>
<text x="47.8" y="868.0" font-size="12" fill="#444">equal-time chords passes through the</text>
<rect x="29.2" y="895.0" width="267.6" height="44.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="38.2" y="913.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.P1C4</text>
<text x="38.2" y="928.0" font-size="12" fill="#444">Force comparison by equal-time sagittae</text>
<rect x="377.2" y="295.0" width="267.6" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="386.2" y="313.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.P2</text>
<text x="386.2" y="328.0" font-size="12" fill="#444">Area-time proportionality about a fixed</text>
<text x="386.2" y="343.0" font-size="12" fill="#444">or uniformly translating point implies</text>
<rect x="731.6" y="385.0" width="254.8" height="74.0" rx="5" fill="#d6ecd2" stroke="#2c6e31" stroke-width="2.2"/>
<text x="740.6" y="403.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.P3</text>
<text x="740.6" y="418.0" font-size="12" fill="#444">Relative area law about a moving body</text>
<text x="740.6" y="433.0" font-size="12" fill="#444">identifies the difference of</text>
<text x="740.6" y="448.0" font-size="12" fill="#2c6e31">4 Lean result(s)</text>
<rect x="734.8" y="310.0" width="248.4" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="743.8" y="328.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.P4</text>
<text x="743.8" y="343.0" font-size="12" fill="#444">Uniform circular-force comparison by</text>
<text x="743.8" y="358.0" font-size="12" fill="#444">squared simultaneous arcs divided by</text>
<rect x="741.2" y="145.0" width="235.6" height="59.0" rx="5" fill="#d6ecd2" stroke="#8d8d8d" stroke-width="1.0"/>
<text x="750.2" y="163.0" font-size="12" font-weight="bold" fill="#1a1a1a">P1713.P6</text>
<text x="750.2" y="178.0" font-size="12" fill="#444">Mid-arc force as sagitta over time</text>
<text x="750.2" y="193.0" font-size="12" fill="#444">squared</text>
<text x="26" y="1023" font-size="12" font-weight="bold">Stages</text>
